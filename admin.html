<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard · Smart Attendance System Admin</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="admin.css" />
  </head>

  <body>
    <div id="sidebar-overlay"></div>

    <div class="layout">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <a href="admin.html" class="logo">
            <div class="logo-mark">SAS</div>
            <span>Smart Attendance System</span>
          </a>

          <button
            id="sidebar-close"
            class="sidebar-close"
            aria-label="Close menu"
          >
            ✕
          </button>
        </div>

        <nav class="sidebar-nav">
          <p class="nav-heading">Overview</p>

          <a href="admin.html" class="nav-link active">
            <span class="nav-dot"></span>
            Dashboard
          </a>

          <a href="#" class="nav-link">
            <span class="nav-dot"></span>
            Classes
          </a>

          <a href="#" class="nav-link">
            <span class="nav-dot"></span>
            Teachers
          </a>

          <a href="#" class="nav-link">
            <span class="nav-dot"></span>
            Students
          </a>

          <p class="nav-heading insights-heading">Insights</p>

          <a href="#" class="nav-link">
            <span class="nav-dot"></span>
            Reports
          </a>

          <a href="#" class="nav-link">
            <span class="nav-dot"></span>
            Settings
          </a>
        </nav>

        <div class="sidebar-footer">
          <div class="admin-profile">
            <div class="avatar">MR</div>

            <div>
              <p>...</p>
              <span>Head Administrator</span>
            </div>
          </div>

          <a href="login.html" class="sign-out">Sign out</a>
        </div>
      </aside>

      <div class="main">
        <header class="topbar">
          <div class="topbar-left">
            <button
              id="sidebar-open"
              class="menu-button"
              aria-label="Open menu"
            >
              <svg
                width="22"
                height="22"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M2 5h18M2 11h18M2 17h18" />
              </svg>
            </button>

            <div>
              <h1>Good morning, ...</h1>
              <p data-today>Loading date…</p>
            </div>
          </div>
          <div class="topbar-right">
            <div class="search-box">
              <input type="search" placeholder="Search students, classes…" />

              <svg
                width="14"
                height="14"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <circle cx="6" cy="6" r="5" />
                <path d="M13 13l-3.5-3.5" />
              </svg>
            </div>

            <button class="notification-button" aria-label="Notifications">
              <svg
                width="16"
                height="16"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path
                  d="M8 1a4 4 0 0 0-4 4v2.5L2.5 10h11L12 7.5V5a4 4 0 0 0-4-4Z"
                />
                <path d="M6.5 12.5a1.5 1.5 0 0 0 3 0" />
              </svg>

              <span></span>
            </button>

            <div class="avatar top-avatar">MR</div>
          </div>
        </header>
      </div>
    </div>
  </body>
</html>

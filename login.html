<!doctype html>

<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Sign in · Smart Attendance System</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="login-page">
      <section class="ink-panel">
        <div class="brand">
          <div class="logo-box">SAS</div>
          <span class="brand-name">Smart Attendance System</span>
        </div>

        <div class="intro">
          <p class="today" data-today>...</p>

          <h1>
            The daily record,<br />
            kept simply.
          </h1>

          <p class="intro-text">
            One place for admins, teachers, and students to mark, track, and
            understand attendance.
          </p>
        </div>

        <div class="panel-footer">
          <span>Kathmandu Bernhardt College</span>
          <span class="footer-dot"></span>
          <span>Est. </span>
        </div>
      </section>

      <section class="paper-panel">
        <div class="login-container">
          <h2>Sign in</h2>

          <p class="login-description">Pick your role and enter credentials.</p>

          <div class="role-tabs">
            <button type="button" data-role-tab="admin" class="role-tab active">
              Admin
            </button>

            <button type="button" data-role-tab="teacher" class="role-tab">
              Teacher
            </button>

            <button type="button" data-role-tab="student" class="role-tab">
              Student
            </button>
          </div>

          <form id="login-form">
            <input type="hidden" id="login-role" value="admin" />

            <div class="form-group">
              <label for="email"> Email address </label>

              <input id="email" type="email" required placeholder="Email" />
            </div>

            <div class="form-group">
              <label for="password"> Password </label>

              <input
                id="password"
                type="password"
                required
                placeholder="Pasword"
              />
            </div>

            <div class="form-options">
              <label class="remember">
                <input type="checkbox" id="remember" />

                <span>Remember me</span>
              </label>

              <a href="#" class="forgot-password"> Forgot password? </a>
            </div>

            <button type="submit" class="sign-in-button">Sign in</button>
          </form>
        </div>
      </section>
    </div>
  </body>
</html>
